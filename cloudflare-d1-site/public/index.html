<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>qze的第一个网站 - 每日任务</title>
    <style>
      :root {
        color-scheme: light;
        --size-caption: 12px;
        --size-control: 14px;
        --size-body: 16px;
        --size-card-title: 18px;
        --size-panel-title: 20px;
        --size-page-title: 24px;
        --size-display: 28px;
        --text-caption: var(--size-caption);
        --text-control: var(--size-control);
        --text-body: var(--size-body);
        --text-card-title: var(--size-card-title);
        --text-panel-title: var(--size-panel-title);
        --text-page-title: var(--size-page-title);
        --text-display: var(--size-display);
        --bg: #f3f7f2;
        --surface: rgba(255, 255, 255, 0.9);
        --surface-strong: #ffffff;
        --text: #18221d;
        --muted: #66746b;
        --line: rgba(38, 80, 52, 0.16);
        --brand: #246b4b;
        --brand-strong: #164733;
        --accent: #f08a5d;
        --danger: #c73e3a;
        --ok: #1f8a55;
        --warn: #b87914;
        --shadow: 0 24px 70px rgba(36, 107, 75, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
        color: var(--text);
        background:
          linear-gradient(120deg, rgba(36, 107, 75, 0.12), transparent 34%),
          linear-gradient(230deg, rgba(240, 138, 93, 0.16), transparent 38%),
          var(--bg);
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.56;
      }

      .app {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 48px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
      }

      .site-title {
        margin: 0;
        color: var(--brand);
        font-size: var(--text-control);
        font-weight: 800;
      }

      .userbar {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: var(--text-control);
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(340px, 1fr);
        gap: 22px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .intro {
        padding: 30px;
      }

      .eyebrow {
        margin-bottom: 12px;
        color: var(--accent);
        font-size: var(--text-control);
        font-weight: 800;
      }

      h2 {
        margin: 0 0 14px;
        font-size: var(--text-display);
        line-height: 1.3;
      }

      .intro p,
      .helper {
        margin: 0;
        color: var(--muted);
        font-size: var(--text-body);
        line-height: 1.65;
      }

      .auth-card,
      .composer,
      .list-panel {
        padding: 24px;
      }

      .auth-card h3,
      .composer h3,
      .list-head h3 {
        margin: 0 0 12px;
        font-size: var(--text-panel-title);
        line-height: 1.35;
      }

      .auth-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 18px;
      }

      .tab-btn,
      .filter-btn,
      .status-btn {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--muted);
        font-size: var(--text-control);
        font-weight: 750;
        white-space: nowrap;
      }

      .tab-btn.is-active,
      .filter-btn.is-active,
      .status-btn.is-active {
        border-color: rgba(36, 107, 75, 0.45);
        background: rgba(36, 107, 75, 0.1);
        color: var(--brand-strong);
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 14px;
      }

      .field span {
        color: var(--brand-strong);
        font-size: var(--text-control);
        font-weight: 750;
      }

      input {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 13px 14px;
        background: rgba(255, 255, 255, 0.94);
        color: var(--text);
        font-size: var(--text-body);
        outline: none;
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
      }

      input:focus {
        border-color: rgba(36, 107, 75, 0.58);
        box-shadow: 0 0 0 4px rgba(36, 107, 75, 0.12);
      }

      .primary-btn,
      .secondary-btn,
      .danger-btn {
        min-height: 42px;
        border-radius: 8px;
        padding: 11px 14px;
        font-size: var(--text-control);
        font-weight: 850;
        white-space: nowrap;
      }

      .primary-btn {
        width: 100%;
        background: linear-gradient(135deg, var(--brand), var(--brand-strong));
        color: white;
        box-shadow: 0 12px 30px rgba(36, 107, 75, 0.22);
      }

      .secondary-btn {
        border: 1px solid rgba(36, 107, 75, 0.22);
        background: white;
        color: var(--brand);
      }

      .danger-btn {
        background: #fff1ee;
        color: var(--danger);
      }

      .message {
        min-height: 24px;
        margin-top: 12px;
        color: var(--muted);
        font-size: var(--text-control);
        line-height: 1.5;
      }

      .message.is-error {
        color: var(--danger);
      }

      .message.is-ok {
        color: var(--ok);
      }

      .workspace {
        display: grid;
        gap: 18px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      .stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.72);
      }

      .stat strong {
        display: block;
        margin-bottom: 4px;
        font-size: var(--text-page-title);
      }

      .stat span {
        color: var(--muted);
        font-size: var(--text-caption);
      }

      .todo-layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 22px;
      }

      .list-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 16px;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }

      .task-list {
        display: grid;
        gap: 14px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .task-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        background: rgba(255, 255, 255, 0.84);
      }

      .task-card.is-completed {
        background: rgba(239, 252, 244, 0.92);
      }

      .task-card.is-failed {
        background: rgba(255, 244, 241, 0.94);
      }

      .task-main {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .task-title {
        margin: 0;
        font-size: var(--text-card-title);
        line-height: 1.45;
      }

      .status-pill {
        flex: none;
        align-self: flex-start;
        border-radius: 999px;
        padding: 7px 10px;
        font-size: var(--text-caption);
        font-weight: 900;
      }

      .status-not_started {
        background: #edf5ff;
        color: #2461a7;
      }

      .status-in_progress {
        background: #fff8e8;
        color: var(--warn);
      }

      .status-completed {
        background: #def8e9;
        color: var(--ok);
      }

      .status-failed {
        background: #ffe7e1;
        color: var(--danger);
      }

      .time-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin: 0 0 12px;
      }

      .time-grid div {
        border-radius: 8px;
        padding: 10px;
        background: rgba(243, 247, 242, 0.86);
      }

      dt {
        margin-bottom: 5px;
        color: var(--muted);
        font-size: var(--text-caption);
      }

      dd {
        margin: 0;
        font-size: var(--text-control);
        font-weight: 780;
      }

      .countdown {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: var(--text-control);
        line-height: 1.5;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }

      .empty {
        border: 1px dashed rgba(36, 107, 75, 0.25);
        border-radius: 8px;
        padding: 28px;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.54);
        font-size: var(--text-body);
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 920px) {
        .shell,
        .todo-layout {
          grid-template-columns: 1fr;
        }

        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 560px) {
        .app {
          width: min(100% - 20px, 1120px);
          padding-top: 18px;
        }

        .topbar,
        .list-head,
        .task-main {
          align-items: stretch;
          flex-direction: column;
        }

        .intro,
        .auth-card,
        .composer,
        .list-panel {
          padding: 18px;
        }

        .time-grid,
        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1 class="site-title">qze的第一个网站</h1>
        <div class="userbar" id="userbar" hidden>
          <span id="currentUser"></span>
          <button class="secondary-btn" id="logoutBtn" type="button">退出登录</button>
        </div>
      </header>

      <section class="shell" id="authView">
        <div class="intro panel">
          <div class="eyebrow">账号任务本</div>
          <h2>每日任务</h2>
          <p>登录后，你创建的任务会绑定到自己的账号。换一台电脑打开网站，再登录同一个账号，也能继续看到自己的任务和历史记录。</p>
        </div>

        <section class="auth-card panel">
          <div class="auth-tabs" aria-label="账号操作">
            <button class="tab-btn is-active" type="button" data-auth-mode="login">登录</button>
            <button class="tab-btn" type="button" data-auth-mode="register">注册</button>
          </div>
          <h3 id="authTitle">登录任务本</h3>
          <p class="helper" id="authHelper">输入你的账号和密码，进入自己的每日任务。</p>
          <label class="field">
            <span>账号</span>
            <input id="usernameInput" autocomplete="username" placeholder="3-24位字母、数字或下划线" />
          </label>
          <label class="field">
            <span>密码</span>
            <input id="passwordInput" type="password" autocomplete="current-password" placeholder="至少6位" />
          </label>
          <button class="primary-btn" id="authSubmitBtn" type="button">登录</button>
          <div class="message" id="authMessage"></div>
        </section>
      </section>

      <section class="workspace" id="todoApp" hidden>
        <div class="stats" aria-label="任务统计">
          <div class="stat"><strong id="countNotStarted">0</strong><span>未开始</span></div>
          <div class="stat"><strong id="countInProgress">0</strong><span>进行中</span></div>
          <div class="stat"><strong id="countCompleted">0</strong><span>已完成</span></div>
          <div class="stat"><strong id="countFailed">0</strong><span>未完成</span></div>
        </div>

        <div class="todo-layout">
          <form class="composer panel" id="taskForm">
            <h3>添加每日任务</h3>
            <p class="helper">任务到达结束时间后，如果还没有标记为已完成，会自动变为未完成。</p>
            <label class="field">
              <span>任务内容</span>
              <input id="taskTitleInput" maxlength="120" placeholder="例如：晚上8点前学习30分钟HTML" required />
            </label>
            <label class="field">
              <span>结束时间</span>
              <input id="deadlineInput" type="datetime-local" required />
            </label>
            <button class="primary-btn" type="submit">添加任务</button>
            <div class="message" id="formMessage"></div>
          </form>

          <section class="list-panel panel">
            <div class="list-head">
              <h3 id="listTitle">当前任务</h3>
              <button class="secondary-btn" id="refreshBtn" type="button">刷新</button>
            </div>

            <div class="filters" id="filters">
              <button class="filter-btn is-active" type="button" data-view="current">当前任务</button>
              <button class="filter-btn" type="button" data-view="history">历史任务</button>
            </div>

            <ul class="task-list" id="taskList"></ul>
            <div class="empty" id="emptyState" hidden>现在还没有任务，先添加一个每日任务吧。</div>
          </section>
        </div>
      </section>
    </main>

    <script>
      const tokenStorageKey = "qzefirst-session-token";
      const userStorageKey = "qzefirst-session-user";
      const statusLabels = {
        not_started: "未开始",
        in_progress: "进行中",
        completed: "已完成",
        failed: "未完成",
      };

      const authView = document.querySelector("#authView");
      const todoApp = document.querySelector("#todoApp");
      const userbar = document.querySelector("#userbar");
      const currentUser = document.querySelector("#currentUser");
      const authTabs = document.querySelector(".auth-tabs");
      const authTitle = document.querySelector("#authTitle");
      const authHelper = document.querySelector("#authHelper");
      const usernameInput = document.querySelector("#usernameInput");
      const passwordInput = document.querySelector("#passwordInput");
      const authSubmitBtn = document.querySelector("#authSubmitBtn");
      const authMessage = document.querySelector("#authMessage");
      const taskForm = document.querySelector("#taskForm");
      const taskTitleInput = document.querySelector("#taskTitleInput");
      const deadlineInput = document.querySelector("#deadlineInput");
      const formMessage = document.querySelector("#formMessage");
      const taskList = document.querySelector("#taskList");
      const emptyState = document.querySelector("#emptyState");
      const refreshBtn = document.querySelector("#refreshBtn");
      const logoutBtn = document.querySelector("#logoutBtn");
      const filters = document.querySelector("#filters");
      const listTitle = document.querySelector("#listTitle");

      let token = localStorage.getItem(tokenStorageKey) || "";
      let user = JSON.parse(localStorage.getItem(userStorageKey) || "null");
      let authMode = "login";
      let tasks = [];
      let activeView = "current";

      function setMessage(element, text, type = "") {
        element.textContent = text;
        element.className = `message ${type ? `is-${type}` : ""}`.trim();
      }

      function toDateTimeLocalValue(value) {
        const date = value instanceof Date ? value : new Date(value);
        const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return local.toISOString().slice(0, 16);
      }

      function formatDate(value) {
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        }).format(new Date(value));
      }

      function formatDistance(deadlineAt, status) {
        if (status === "completed") return "任务已完成";
        const diff = new Date(deadlineAt).getTime() - Date.now();
        if (diff <= 0) return "已到结束时间，任务未完成";
        const totalMinutes = Math.ceil(diff / 60000);
        const days = Math.floor(totalMinutes / 1440);
        const hours = Math.floor((totalMinutes % 1440) / 60);
        const minutes = totalMinutes % 60;
        if (days > 0) return `距离结束还有 ${days} 天 ${hours} 小时`;
        if (hours > 0) return `距离结束还有 ${hours} 小时 ${minutes} 分钟`;
        return `距离结束还有 ${minutes} 分钟`;
      }

      async function apiFetch(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: {
            Authorization: token ? `Bearer ${token}` : "",
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || "操作失败，请稍后再试。");
        }
        return data;
      }

      async function authenticate() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!username || !password) {
          setMessage(authMessage, "请先填写账号和密码。", "error");
          return;
        }

        try {
          const data = await apiFetch(`/api/auth/${authMode}`, {
            method: "POST",
            body: JSON.stringify({ username, password }),
          });
          token = data.token;
          user = data.user;
          localStorage.setItem(tokenStorageKey, token);
          localStorage.setItem(userStorageKey, JSON.stringify(user));
          await enterApp();
        } catch (error) {
          setMessage(authMessage, error.message, "error");
        }
      }

      async function enterApp() {
        currentUser.textContent = user ? user.username : "";
        authView.hidden = true;
        todoApp.hidden = false;
        userbar.hidden = false;
        await loadTasks();
      }

      async function loadTasks() {
        const data = await apiFetch("/api/tasks");
        tasks = data.tasks || [];
        renderTasks();
      }

      async function createTask(title, deadlineAt) {
        const data = await apiFetch("/api/tasks", {
          method: "POST",
          body: JSON.stringify({ title, deadlineAt }),
        });
        tasks = [data.task, ...tasks];
        renderTasks();
      }

      async function patchTask(id, patch) {
        const data = await apiFetch("/api/tasks", {
          method: "PATCH",
          body: JSON.stringify({ id, ...patch }),
        });
        tasks = tasks.map((task) => (task.id === id ? data.task : task));
        renderTasks();
      }

      async function deleteTask(id) {
        await apiFetch(`/api/tasks?id=${encodeURIComponent(id)}`, { method: "DELETE" });
        tasks = tasks.filter((task) => task.id !== id);
        renderTasks();
      }

      function syncLocalExpiredTasks() {
        let changed = false;
        const now = Date.now();
        tasks = tasks.map((task) => {
          if (task.status !== "completed" && new Date(task.deadlineAt).getTime() <= now && task.status !== "failed") {
            changed = true;
            return { ...task, status: "failed" };
          }
          return task;
        });
        if (changed) renderTasks();
      }

      function updateStats() {
        const counts = tasks.reduce(
          (result, task) => {
            result[task.status] += 1;
            return result;
          },
          { not_started: 0, in_progress: 0, completed: 0, failed: 0 }
        );

        document.querySelector("#countNotStarted").textContent = counts.not_started;
        document.querySelector("#countInProgress").textContent = counts.in_progress;
        document.querySelector("#countCompleted").textContent = counts.completed;
        document.querySelector("#countFailed").textContent = counts.failed;
      }

      function getVisibleTasks() {
        if (activeView === "history") {
          return [...tasks].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        }
        return tasks
          .filter((task) => task.status === "not_started" || task.status === "in_progress")
          .sort((a, b) => new Date(a.deadlineAt) - new Date(b.deadlineAt));
      }

      function renderTasks() {
        updateStats();
        listTitle.textContent = activeView === "history" ? "历史任务" : "当前任务";
        const visibleTasks = getVisibleTasks();
        taskList.innerHTML = "";
        emptyState.hidden = visibleTasks.length > 0;
        emptyState.textContent = activeView === "history" ? "暂时还没有历史任务。" : "现在还没有当前任务，先添加一个每日任务吧。";

        for (const task of visibleTasks) {
          const item = document.createElement("li");
          item.className = `task-card is-${task.status}`;
          item.innerHTML = `
            <div class="task-main">
              <h4 class="task-title"></h4>
              <span class="status-pill status-${task.status}">${statusLabels[task.status]}</span>
            </div>
            <dl class="time-grid">
              <div>
                <dt>创建时间</dt>
                <dd>${formatDate(task.createdAt)}</dd>
              </div>
              <div>
                <dt>结束时间</dt>
                <dd>${formatDate(task.deadlineAt)}</dd>
              </div>
            </dl>
            <p class="countdown">${activeView === "history" ? `完成情况：${statusLabels[task.status]}` : formatDistance(task.deadlineAt, task.status)}</p>
            <div class="actions" ${activeView === "history" ? "hidden" : ""}>
              <button class="status-btn ${task.status === "not_started" ? "is-active" : ""}" type="button" data-action="status" data-status="not_started">未开始</button>
              <button class="status-btn ${task.status === "in_progress" ? "is-active" : ""}" type="button" data-action="status" data-status="in_progress">进行中</button>
              <button class="status-btn ${task.status === "completed" ? "is-active" : ""}" type="button" data-action="status" data-status="completed">已完成</button>
              <button class="secondary-btn" type="button" data-action="deadline" ${task.deadlineEdited ? "disabled" : ""}>${task.deadlineEdited ? "已改过时间" : "修改结束时间"}</button>
              <button class="danger-btn" type="button" data-action="delete">删除</button>
            </div>
          `;

          item.querySelector(".task-title").textContent = task.title;
          item.querySelectorAll("[data-action='status']").forEach((button) => {
            button.disabled = task.status === "failed" || button.dataset.status === task.status;
            button.addEventListener("click", async () => {
              try {
                await patchTask(task.id, { status: button.dataset.status });
                setMessage(formMessage, `任务已改为：${statusLabels[button.dataset.status]}`, "ok");
              } catch (error) {
                setMessage(formMessage, error.message, "error");
              }
            });
          });

          const deadlineButton = item.querySelector("[data-action='deadline']");
          if (deadlineButton) {
            deadlineButton.disabled = task.deadlineEdited || task.status === "completed";
            deadlineButton.addEventListener("click", async () => {
              const current = toDateTimeLocalValue(task.deadlineAt).replace("T", " ");
              const input = prompt("请输入新的结束时间，格式：2026-08-10 18:30", current);
              if (!input) return;
              const nextDate = new Date(input.trim().replace(/\s+/, "T"));
              if (Number.isNaN(nextDate.getTime())) {
                setMessage(formMessage, "时间格式不正确，请使用：2026-08-10 18:30", "error");
                return;
              }
              try {
                await patchTask(task.id, { deadlineAt: nextDate.toISOString() });
                setMessage(formMessage, "结束时间已修改。", "ok");
              } catch (error) {
                setMessage(formMessage, error.message, "error");
              }
            });
          }

          const deleteButton = item.querySelector("[data-action='delete']");
          if (deleteButton) {
            deleteButton.addEventListener("click", async () => {
              if (!confirm("确定删除这个任务吗？")) return;
              try {
                await deleteTask(task.id);
                setMessage(formMessage, "任务已删除。", "ok");
              } catch (error) {
                setMessage(formMessage, error.message, "error");
              }
            });
          }

          taskList.appendChild(item);
        }
      }

      function setDefaultDeadline() {
        const nextHour = new Date();
        nextHour.setHours(nextHour.getHours() + 1, 0, 0, 0);
        deadlineInput.min = toDateTimeLocalValue(new Date());
        deadlineInput.value = toDateTimeLocalValue(nextHour);
      }

      authTabs.addEventListener("click", (event) => {
        const button = event.target.closest("[data-auth-mode]");
        if (!button) return;
        authMode = button.dataset.authMode;
        authTabs.querySelectorAll(".tab-btn").forEach((item) => item.classList.remove("is-active"));
        button.classList.add("is-active");
        authTitle.textContent = authMode === "login" ? "登录任务本" : "注册新账号";
        authHelper.textContent = authMode === "login" ? "输入你的账号和密码，进入自己的每日任务。" : "创建账号后，之后换电脑也能登录查看自己的任务。";
        authSubmitBtn.textContent = authMode === "login" ? "登录" : "注册并登录";
        passwordInput.autocomplete = authMode === "login" ? "current-password" : "new-password";
        setMessage(authMessage, "");
      });

      authSubmitBtn.addEventListener("click", authenticate);
      passwordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") authenticate();
      });

      taskForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const title = taskTitleInput.value.trim();
        const deadlineAt = new Date(deadlineInput.value).toISOString();
        try {
          await createTask(title, deadlineAt);
          taskTitleInput.value = "";
          setDefaultDeadline();
          setMessage(formMessage, "任务已保存。", "ok");
        } catch (error) {
          setMessage(formMessage, error.message, "error");
        }
      });

      refreshBtn.addEventListener("click", async () => {
        try {
          await loadTasks();
          setMessage(formMessage, "任务已刷新。", "ok");
        } catch (error) {
          setMessage(formMessage, error.message, "error");
        }
      });

      logoutBtn.addEventListener("click", async () => {
        try {
          await apiFetch("/api/auth/logout", { method: "POST" });
        } catch {}
        localStorage.removeItem(tokenStorageKey);
        localStorage.removeItem(userStorageKey);
        token = "";
        user = null;
        tasks = [];
        todoApp.hidden = true;
        userbar.hidden = true;
        authView.hidden = false;
        passwordInput.value = "";
        setMessage(authMessage, "已退出登录。");
      });

      filters.addEventListener("click", (event) => {
        const button = event.target.closest("[data-view]");
        if (!button) return;
        activeView = button.dataset.view;
        filters.querySelectorAll(".filter-btn").forEach((item) => item.classList.remove("is-active"));
        button.classList.add("is-active");
        renderTasks();
      });

      setDefaultDeadline();
      setInterval(syncLocalExpiredTasks, 1000);

      if (token && user) {
        enterApp().catch(() => {
          localStorage.removeItem(tokenStorageKey);
          localStorage.removeItem(userStorageKey);
          token = "";
          user = null;
          authView.hidden = false;
          todoApp.hidden = true;
          userbar.hidden = true;
        });
      }
    </script>
  </body>
</html>
